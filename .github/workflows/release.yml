name: Release Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Package version, without a leading v
        required: true
        default: '1.0.0'
        type: string

env:
  APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  build-linux:
    name: Build and package Linux binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate package version
        run: |
          VERSION="${APP_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+([.][0-9]+){2}$ ]]; then
            echo "Package version must use numeric X.Y.Z form: $VERSION" >&2
            exit 2
          fi

      - name: Install build and package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-tools-dev qt6-l10n-tools \
            libpipewire-0.3-dev dpkg-dev rpm imagemagick

      - name: Configure
        run: cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build Debian, RPM, and tar.gz packages
        run: |
          mkdir -p release-output
          packaging/package-linux.sh "${APP_VERSION}" build release-output all

      - name: Inspect binary package metadata
        run: |
          dpkg-deb --info release-output/*.deb
          rpm -qip release-output/*.rpm
          tar -tzf release-output/*.tar.gz >/dev/null

      - name: Stage files for AppImage and package inspection
        run: |
          packaging/stage-linux.sh build install-root /usr
          test -f install-root/usr/share/audiomonitor/translations/audiomonitor_en.qm
          test -f install-root/usr/share/audiomonitor/translations/audiomonitor_zh_CN.qm

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: |
            release-output/*
            install-root/**

  package-appimage:
    name: Build AppImage
    needs: build-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download staged install tree
        uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: downloaded

      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libpipewire-0.3-dev imagemagick wget

      - name: Download linuxdeploy and Qt plugin
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          VERSION="${APP_VERSION#v}"
          export VERSION
          mkdir -p AppDir
          cp -a downloaded/install-root/usr AppDir/

          QMAKE_PATH="$(command -v qmake6 || command -v qmake || true)"
          if [[ -z "$QMAKE_PATH" ]]; then
            QMAKE_PATH="$(find /usr/lib /usr/libexec -type f \
              -path '*/qt6/bin/qmake*' -print -quit 2>/dev/null || true)"
          fi
          test -x "$QMAKE_PATH"
          export QMAKE="$QMAKE_PATH"
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --plugin qt \
            --exclude-library 'libpipewire-0.3.so.0' \
            --output appimage

          mapfile -t appimages < <(find . -maxdepth 1 -type f -name '*.AppImage' \
            ! -name 'linuxdeploy*.AppImage')
          test "${#appimages[@]}" -eq 1
          mv "${appimages[0]}" "audiomonitor-${VERSION}-x86_64.AppImage"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage-package
          path: audiomonitor-*-x86_64.AppImage

  package-arch:
    name: Build Arch package
    needs: build-linux
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git cmake ninja pkgconf qt6-base qt6-tools pipewire

      - name: Build package with makepkg
        run: |
          VERSION="${APP_VERSION#v}"
          mkdir -p arch-build release-output
          cp packaging/PKGBUILD arch-build/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" arch-build/PKGBUILD

          # Manual runs may package a branch without a corresponding tag.
          # Feed makepkg a local source archive while leaving the published
          # PKGBUILD in its normal tag-based form.
          if [[ "${GITHUB_REF_TYPE}" != tag ]]; then
            SOURCE_ARCHIVE="audiomonitor-${VERSION}.tar.gz"
            git archive --format=tar.gz --prefix="audiomonitor-${VERSION}/" \
              --output="arch-build/${SOURCE_ARCHIVE}" HEAD
            SOURCE_SHA256=$(sha256sum "arch-build/${SOURCE_ARCHIVE}" | cut -d' ' -f1)
            sed -i "s|^source=.*|source=(\"${SOURCE_ARCHIVE}\")|" arch-build/PKGBUILD
            sed -i "s|^sha256sums=.*|sha256sums=('${SOURCE_SHA256}')|" arch-build/PKGBUILD
          fi

          cp packaging/PKGBUILD release-output/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" release-output/PKGBUILD
          useradd --create-home builder
          chown -R builder:builder arch-build
          (cd arch-build && runuser -u builder -- makepkg --cleanbuild --nodeps --noconfirm)
          cp arch-build/audiomonitor-*.pkg.tar.zst release-output/
          pacman -Qip release-output/*.pkg.tar.zst

      - name: Upload Arch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: release-output/*

  check-nix:
    name: Check Nix package
    needs: build-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build Nix package
        run: nix build .#audiomonitor --no-link

  create-release:
    name: Publish release assets
    needs: [build-linux, package-appimage, package-arch, check-nix]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-package'
          path: downloaded-packages
          merge-multiple: true

      - name: Prepare release assets and checksums
        run: |
          mkdir -p release-assets
          find downloaded-packages -type f \( \
            -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' \
            -o -name '*.AppImage' -o -name '*.pkg.tar.zst' -o -name 'PKGBUILD' \
          \) -exec cp {} release-assets/ \;
          (cd release-assets && sha256sum * > SHA256SUMS)
          ls -lh release-assets

      - name: Generate release notes
        run: |
          VERSION="${APP_VERSION#v}"
          cat > release-notes.md << EOF
          # AudioMonitor ${VERSION}

          Linux assets include Debian (.deb), RPM (.rpm), generic binary (.tar.gz),
          AppImage, and Arch Linux (.pkg.tar.zst plus PKGBUILD) packages.

          All Linux packages require a running PipeWire graph and session manager.
          The AppImage bundles Qt but intentionally uses the host PipeWire client.
          Nix users can build directly with:

          \`\`\`sh
          nix build github:luobolong/audiomonitor/${APP_VERSION}
          \`\`\`

          Verify downloaded assets with the accompanying SHA256SUMS file.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
