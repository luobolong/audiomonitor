name: Release Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Package version, without a leading v
        required: true
        default: '1.0.0'
        type: string

env:
  APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  build-linux:
    name: Build and package Linux binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate package version
        run: |
          VERSION="${APP_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+([.][0-9]+){2}$ ]]; then
            echo "Package version must use numeric X.Y.Z form: $VERSION" >&2
            exit 2
          fi

      - name: Install build and package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-tools-dev qt6-l10n-tools \
            libpipewire-0.3-dev dpkg-dev rpm imagemagick

      - name: Configure
        run: cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build Debian, RPM, and tar.gz packages
        run: |
          mkdir -p release-output
          packaging/package-linux.sh "${APP_VERSION}" build release-output all

      - name: Inspect binary package metadata
        run: |
          dpkg-deb --info release-output/*.deb
          rpm -qip release-output/*.rpm
          tar -tzf release-output/*.tar.gz >/dev/null

      - name: Stage files for AppImage and package inspection
        run: |
          packaging/stage-linux.sh build install-root /usr
          test -f install-root/usr/share/audiomonitor/translations/audiomonitor_en.qm
          test -f install-root/usr/share/audiomonitor/translations/audiomonitor_zh_CN.qm

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: |
            release-output/*
            install-root/**

  package-appimage:
    name: Build AppImage
    needs: build-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download staged install tree
        uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: downloaded

      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libpipewire-0.3-dev imagemagick wget

      - name: Download linuxdeploy and Qt plugin
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          VERSION="${APP_VERSION#v}"
          export VERSION
          mkdir -p AppDir
          cp -a downloaded/install-root/usr AppDir/

          QMAKE_PATH="$(command -v qmake6 || command -v qmake || true)"
          if [[ -z "$QMAKE_PATH" ]]; then
            QMAKE_PATH="$(find /usr/lib /usr/libexec -type f \
              -path '*/qt6/bin/qmake*' -print -quit 2>/dev/null || true)"
          fi
          test -x "$QMAKE_PATH"
          export QMAKE="$QMAKE_PATH"
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --plugin qt \
            --exclude-library 'libpipewire-0.3.so.0' \
            --output appimage

          mapfile -t appimages < <(find . -maxdepth 1 -type f -name '*.AppImage' \
            ! -name 'linuxdeploy*.AppImage')
          test "${#appimages[@]}" -eq 1
          mv "${appimages[0]}" "audiomonitor-${VERSION}-x86_64.AppImage"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage-package
          path: audiomonitor-*-x86_64.AppImage

  package-windows:
    name: Build and package Windows portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage portable bundle
        shell: pwsh
        run: |
          $bundleDir = 'package/audiomonitor-windows'
          cmake -E make_directory $bundleDir
          cmake -E copy build/Release/audiomonitor.exe "$bundleDir/audiomonitor.exe"

          # This Widgets-only application does not use OpenGL, D3D shaders,
          # networking, SVG, external image codecs, or touch input plugins.
          windeployqt --release --no-compiler-runtime --no-translations --no-opengl-sw --no-system-d3d-compiler --no-system-dxc-compiler --skip-plugin-types 'generic,iconengines,imageformats,networkinformation,tls' "$bundleDir/audiomonitor.exe"

          # App-local CRT DLLs are much smaller than bundling vc_redist.x64.exe
          # and keep the portable package runnable on a clean Windows install.
          if (-not $env:VCToolsRedistDir) {
            throw 'VCToolsRedistDir is not set by the MSVC environment'
          }
          $crtRoot = Join-Path $env:VCToolsRedistDir 'x64'
          $crtDirs = @(Get-ChildItem -LiteralPath $crtRoot -Directory `
            -Filter 'Microsoft.VC*.CRT' -ErrorAction SilentlyContinue)
          if ($crtDirs.Count -eq 0) {
            throw "MSVC runtime directory not found below: $crtRoot"
          }
          $crtDir = $crtDirs | Sort-Object -Property Name -Descending |
            Select-Object -First 1
          Write-Host "Using MSVC runtime: $($crtDir.FullName)"
          Get-ChildItem -LiteralPath $crtDir.FullName -Filter '*.dll' -File |
            Copy-Item -Destination $bundleDir

      - name: Verify package
        shell: pwsh
        run: |
          $bundleDir = 'package/audiomonitor-windows'
          $required = @(
            "$bundleDir/audiomonitor.exe",
            "$bundleDir/Qt6Core.dll",
            "$bundleDir/Qt6Gui.dll",
            "$bundleDir/Qt6Widgets.dll",
            "$bundleDir/platforms/qwindows.dll",
            "$bundleDir/msvcp140.dll",
            "$bundleDir/vcruntime140.dll"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing deployed file: $path"
            }
          }

          $process = Start-Process -FilePath "$bundleDir/audiomonitor.exe" `
            -ArgumentList '--smoke-test', '500' -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Packaged application exited with code $($process.ExitCode)"
          }

      - name: Create portable zip
        shell: pwsh
        run: |
          $version = $env:APP_VERSION.TrimStart('v')
          $zipName = "audiomonitor-${version}-windows-x64.zip"
          Compress-Archive -Path 'package/audiomonitor-windows' `
            -DestinationPath $zipName -CompressionLevel Optimal
          Get-Item $zipName | Select-Object Name, Length

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          $wixDir = Join-Path $env:RUNNER_TEMP 'wix314'
          New-Item -ItemType Directory -Force -Path $wixDir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $wixDir -Force
          "WIX_DIR=$wixDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build MSI installer
        shell: pwsh
        run: |
          $env:PATH = "$env:WIX_DIR;$env:PATH"
          # Reuse the verified bundle (exe + Qt runtime + CRT) as the payload.
          cmake -E remove_directory build/deploy
          cmake -E copy_directory package/audiomonitor-windows build/deploy
          cpack --config build/CPackConfig.cmake -B build/msi -G WIX -C Release
          $version = $env:APP_VERSION.TrimStart('v')
          $msiName = "audiomonitor-${version}-windows-x64.msi"
          $msi = Get-ChildItem -Path 'build/msi' -Filter '*.msi' |
            Select-Object -First 1
          if (-not $msi) {
            throw 'CPack did not produce an MSI package'
          }
          Move-Item -LiteralPath $msi.FullName -Destination $msiName -Force
          Get-Item $msiName | Select-Object Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            audiomonitor-*-windows-x64.zip
            audiomonitor-*-windows-x64.msi

  create-release:
    name: Publish release assets
    needs: [build-linux, package-appimage, package-windows]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-package'
          path: downloaded-packages
          merge-multiple: true

      - name: Prepare release assets and checksums
        run: |
          mkdir -p release-assets
          find downloaded-packages -type f \( \
            -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' \
            -o -name '*.AppImage' -o -name '*.zip' -o -name '*.msi' \
          \) -exec cp {} release-assets/ \;
          (cd release-assets && sha256sum * > SHA256SUMS)
          ls -lh release-assets

      - name: Generate release notes
        run: |
          VERSION="${APP_VERSION#v}"
          cat > release-notes.md << EOF
          # AudioMonitor ${VERSION}

          Assets include Debian (.deb), RPM (.rpm), generic Linux binary (.tar.gz),
          AppImage, and Windows installers (portable .zip and .msi).

          All Linux packages require a running PipeWire graph and session manager.
          The AppImage bundles Qt but intentionally uses the host PipeWire client.
          The Windows zip bundles Qt and the MSVC runtime and runs without
          installation on Windows 10/11; the MSI installs AudioMonitor into
          Program Files with Start-menu and desktop shortcuts.
          Verify downloaded assets with the accompanying SHA256SUMS file.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
